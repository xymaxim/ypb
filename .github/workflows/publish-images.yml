name: Publish main images

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build main image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ github.repository }}
          tags: latest ${{ github.ref_name }}
          oci: true
          containerfiles: |
            ./containers/ypb/Containerfile

      - name: Build bin image
        id: build-bin-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ github.repository }}
          tags: bin-latest bin-${{ github.ref_name }}
          oci: true
          containerfiles: |
            ./containers/ypb/Containerfile.bin

      - name: Push bin image
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-bin-image.outputs.image }}
          tags: ${{ steps.build-bin-image.outputs.tags }}
          registry: ghcr.io

      - name: Push main image
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io

  publish-compose:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push compose.yaml as OCI artifact
        run: |
          cd containers/ypb-compose
          oras push \
            --artifact-type application/vnd.docker.compose.project \
            --annotation org.opencontainers.image.title="Ypb Compose" \
            --annotation org.opencontainers.image.description="Compose file to run ypb with PO token provider" \
            --annotation org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --annotation org.opencontainers.image.version=${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}-compose:latest \
            compose.yaml .env
          oras push \
            --artifact-type application/vnd.docker.compose.project \
            --annotation org.opencontainers.image.title="Ypb Compose" \
            --annotation org.opencontainers.image.description="Compose file to run ypb with PO token provider" \
            --annotation org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --annotation org.opencontainers.image.version=${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}-compose:${{ github.ref_name }} \
            compose.yaml .env
