name: Publish ypb-mock image

on:
  push:
    branches: [main]
    paths:
      - 'containers/ypb-mock/**'

jobs:
  publish-mock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ypb-mock
          tags: latest
          oci: true
          containerfiles: |
            ./containers/ypb-mock/Containerfile
          context: ./containers/ypb-mock

      - name: Push image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
