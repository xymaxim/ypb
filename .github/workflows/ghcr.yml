name: Build and Push Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build main image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ github.repository }}
          tags: latest ${{ github.ref_name }}
          oci: true
          containerfiles: |
            ./Containerfile

      - name: Build bin image
        id: build-bin-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ github.repository }}
          tags: bin-latest bin-${{ github.ref_name }}
          oci: true
          containerfiles: |
            ./bin.containerfile

      - name: Push main image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io

      - name: Push bin image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-bin-image.outputs.image }}
          tags: ${{ steps.build-bin-image.outputs.tags }}
          registry: ghcr.io
