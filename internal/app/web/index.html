<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ypb Play</title>
<style>
  html, body {
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  header {
    width: 100%;
    max-width: 720px;
  }
  h3 {
      margin-block-end: 0;
  }
  h3 a {
    color: inherit;
    text-decoration: none;
  }
  #channel a {
    color: inherit;
    text-decoration: none;
  }
  #player-container {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 16 / 9;
    margin-top: 1em;
    background: black;
    border-radius: 12px;
    overflow: hidden;
  }
  #player-container video {
    width: 100%;
    height: 100%;
  }
  #status {
      display: block;
      margin-block-end: 1em;
      color: tomato;
  }
  #status:empty {
    display: none;
    margin-block-end: 0;
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Dash-Industry-Forum/dash.js@v5.2.0/contrib/controlbar/controlbar.css">
<style>
  .cb-rate-group,
  .cb-live-indicator {
    display: none;
  }
</style>
</head>
<body>
<header>
  <h3><a id="live" href="#"></a></h3>
  <div id="channel"><a href="#"></a></div>
  <span id="status"></span>
</header>
<div id="player-container">
  <video id="player" muted playsinline></video>
</div>
<script type="module">
  import { MediaPlayer, Protection } from 'https://cdn.dashjs.org/v5.2.0/modern/esm/dash.all.min.js';
  import { ControlBar } from 'https://cdn.jsdelivr.net/gh/Dash-Industry-Forum/dash.js@v5.2.0/contrib/controlbar/ControlBar.js';

  window.dashjs = { MediaPlayer, Protection };

  const interval = new URLSearchParams(location.search).get('i') || 'now';
  const mpdURL = new URL(`/mpd/${encodeURIComponent(interval)}`, location.href).href;
  const video = document.getElementById('player');
  const status = document.getElementById('status');
  const liveLink = document.getElementById('live');
  const channelLink = document.getElementById('channel').firstElementChild;

  const showError = (message) => {
    status.textContent = message;
  };
  const clearError = () => {
    status.textContent = '';
  };

  const player = MediaPlayer().create();
  player.on(MediaPlayer.events.ERROR, (e) => {
    showError(`Playback error: ${e.error?.message || e.error || e.message || 'unknown'}`);
  });
  player.on(MediaPlayer.events.PLAYBACK_PLAYING, clearError);
  player.on(MediaPlayer.events.STREAM_INITIALIZED, clearError);

  player.initialize(video, mpdURL, true);

  const controlbar = new ControlBar(player, video);
  controlbar.init(document.getElementById('player-container'));
  controlbar.enable();

  try {
    const res = await fetch('/info');
    if (res.ok) {
      const info = await res.json();
      document.title = info.title;
      liveLink.textContent = info.title;
      liveLink.href = `https://www.youtube.com/live/${info.id}`;
      if (info.channelId && info.channelTitle) {
        channelLink.textContent = info.channelTitle;
        channelLink.href = `https://www.youtube.com/channel/${info.channelId}`;
      }
    }
  } catch {
  }
</script>
</body>
</html>
