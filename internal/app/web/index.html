<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ypb Play</title>
<style>
  html, body {
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  header {
    width: 100%;
    max-width: 720px;
  }
  h3 a {
    color: inherit;
    text-decoration: none;
  }
  video {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 12px;
  }
  #status {
      display: block;
      margin-block-end: 1em;
      color: tomato;
  }
  #status:empty {
    display: none;
    margin-block-end: 0;
  }
</style>
</head>
<body>
<header>
  <h3><a id="live" href="#">Live stream</a></h3>
  <span id="status"></span>
</header>
<video id="player" controls muted playsinline></video>
<script type="module">
  import { MediaPlayer } from 'https://cdn.dashjs.org/v5.2.0/modern/esm/dash.all.min.js';

  const interval = new URLSearchParams(location.search).get('i') || 'now';
  const mpdURL = new URL(`/mpd/${encodeURIComponent(interval)}`, location.href).href;
  const video = document.getElementById('player');
  const status = document.getElementById('status');
  const liveLink = document.getElementById('live');
  const channelLink = document.getElementById('channel').firstElementChild;

  const showError = (message) => {
    status.textContent = message;
  };
  const clearError = () => {
    status.textContent = '';
  };

  const player = MediaPlayer().create();
  player.on(MediaPlayer.events.ERROR, (e) => {
    showError(`Playback error: ${e.error?.message || e.error || e.message || 'unknown'}`);
  });
  player.on(MediaPlayer.events.PLAYBACK_PLAYING, clearError);
  player.on(MediaPlayer.events.STREAM_INITIALIZED, clearError);

  player.initialize(video, mpdURL, true);

  try {
    const res = await fetch('/info');
    if (res.ok) {
      const info = await res.json();
      document.title = info.title;
      liveLink.textContent = info.title;
      liveLink.href = `https://www.youtube.com/live/${info.id}`;
    }
  } catch {
  }
</script>
</body>
</html>
