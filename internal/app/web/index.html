<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ypb Play</title>
<style>
  html, body {
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  header {
    width: 100%;
    max-width: 720px;
  }
  h3 {
      margin-block-end: 0;
  }
  h3 a {
    color: inherit;
    text-decoration: none;
  }
  #channel a {
    color: inherit;
    text-decoration: none;
  }
  #player-container {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 16 / 9;
    margin-top: 1em;
    background: black;
    border-radius: 12px;
    overflow: hidden;
  }
  #player-container video {
    width: 100%;
    height: 100%;
  }
  .center-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .center-play.hidden {
    opacity: 0;
    visibility: hidden;
  }
  #status {
    display: block;
    margin-block-end: 1em;
    color: tomato;
  }
  #status:empty {
    display: none;
    margin-block-end: 0;
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Dash-Industry-Forum/dash.js@v5.2.0/contrib/controlbar/controlbar.css">
<style>
  .cb-controlbar {
      --cb-accent: #fff;
      font-family: sans-serif;
  }
  .cb-btn {
      font-size: 1.375rem;
      opacity: 0.8;
  }
  .cb-rate-group,
  .cb-live-indicator {
    display: none;
  }
</style>
</head>
<body>
<header>
  <h3><a id="live" href="#"></a></h3>
  <div id="channel"><a href="#"></a></div>
  <span id="status"></span>
</header>
<div id="player-container">
  <video id="player" muted playsinline></video>
  <button id="center-play" class="center-play" aria-label="Play">
    <i class="bi bi-play-fill"></i>
  </button>
</div>
<script type="module">
  import { MediaPlayer } from 'https://cdn.dashjs.org/v5.2.0/modern/esm/dash.all.min.js';
  import { ControlBar } from 'https://cdn.jsdelivr.net/gh/Dash-Industry-Forum/dash.js@v5.2.0/contrib/controlbar/ControlBar.js';

  window.dashjs = { MediaPlayer };

  const interval = new URLSearchParams(location.search).get('i') || 'now';
  const mpdURL = new URL(`/mpd/${encodeURIComponent(interval)}`, location.href).href;
  const video = document.getElementById('player');
  const status = document.getElementById('status');
  const liveLink = document.getElementById('live');
  const channelLink = document.getElementById('channel').firstElementChild;

  const showError = (message) => {
    status.textContent = message;
  };
  const clearError = () => {
    status.textContent = '';
  };

  const player = MediaPlayer().create();
  player.on(MediaPlayer.events.ERROR, (e) => {
    showError(`Playback error: ${e.error?.message || e.error || e.message || 'unknown'}`);
  });
  player.on(MediaPlayer.events.PLAYBACK_PLAYING, clearError);
  player.on(MediaPlayer.events.STREAM_INITIALIZED, clearError);

  player.initialize(video, mpdURL, true);

  const controlbar = new ControlBar(player, video);
  controlbar.init(document.getElementById('player-container'));
  controlbar.enable();

  const playerContainer = document.getElementById('player-container');
  const centerPlay = document.getElementById('center-play');
  const centerPlayIcon = centerPlay.querySelector('i');
  let hovering = false;

  const setCenterIcon = (playing) => {
    centerPlayIcon.className = playing ? 'bi bi-pause-fill' : 'bi bi-play-fill';
    centerPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  };
  const refreshCenter = () => {
    centerPlay.classList.toggle('hidden', !(player.isPaused() || hovering));
  };
  centerPlay.addEventListener('click', () => {
    player.isPaused() ? player.play() : player.pause();
  });
  playerContainer.addEventListener('mouseenter', () => { hovering = true; refreshCenter(); });
  playerContainer.addEventListener('mouseleave', () => { hovering = false; refreshCenter(); });
  player.on(MediaPlayer.events.PLAYBACK_PLAYING, () => { setCenterIcon(true); refreshCenter(); });
  player.on(MediaPlayer.events.PLAYBACK_PAUSED, () => { setCenterIcon(false); refreshCenter(); });
  player.on(MediaPlayer.events.PLAYBACK_ENDED, () => { setCenterIcon(false); refreshCenter(); });

  try {
    const res = await fetch('/info');
    if (res.ok) {
      const info = await res.json();
      document.title = info.title;
      liveLink.textContent = info.title;
      liveLink.href = `https://www.youtube.com/live/${info.id}`;
      if (info.channelId && info.channelTitle) {
        channelLink.textContent = info.channelTitle;
        channelLink.href = `https://www.youtube.com/channel/${info.channelId}`;
      }
    }
  } catch {
  }
</script>
</body>
</html>
